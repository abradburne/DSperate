# DSperate, for DSlot (packaging/arch/dslot/dsperate.toml in DSperate; installed as
# /usr/share/dslot/emulators/dsperate.toml). DSperate plays DS and GBA games.
name = "DSperate"
priority = 100

# Each system it plays and the command for it. Placeholders are whole words: {rom}, {saves}
# (the game's saves folder, made by DSlot), {options} (its options as set, and any extra words).
[systems]
NDS = ["/usr/bin/dsperate", "{options}", "--saves", "{saves}", "--states", "{saves}", "{rom}"]
GBA = ["/usr/bin/dsperate", "--gba", "{options}", "--saves", "{saves}", "--states", "{saves}", "{rom}"]

[env]
DS_DEBUG = "marks"

# Where playing earns RetroAchievements (nibkit 0.2.0's [achievements]): DSlot passes the
# player's sign-in (RA_TOKEN_FILE, RA_USERNAME, RA_HARDCORE) to these systems' games only.
# Casual only for now: DSperate forces hardcore off.
[achievements]
systems = ["NDS"]
hardcore = false

# Put in place before a game starts when missing; never overwritten.
[[seed]]
from = "/usr/share/dsperate/dslot/dsperate.ini"
to = "~/.config/dsperate/dsperate.ini"

# Options DSlot shows in its settings (per console and per game) and passes when set.
# `default` is what DSperate does when not told (with the settings seeded above): shown,
# never passed. One that is set wins over DSperate's own menu for that game.
[[options]]
key = "hires3d"
label = "3D resolution"
systems = ["NDS"]
values = [1, 2, 3, 4]
labels = ["1x (256x192)", "2x (512x384)", "3x (768x576)", "4x (1024x768, slow)"]
default = 1
args = ["--hires3d", "{value}"]

[[options]]
key = "aa"
label = "3D anti-aliasing"
systems = ["NDS"]
kind = "toggle"
default = false
args = ["--aa"]
off = ["--no-aa"]

# Adaptive: frames go undrawn only while the game runs behind, at most this many in a row;
# and at a 3D resolution above 1x, while the GPU is behind, every other frame is shown (an even
# 30 a second, the game and its sound at full speed) before the 3D drops to 1x. Off: the 3D
# drops to 1x straight away (when 3D resolution fallback is on).
[[options]]
key = "frameskip"
label = "Frame skip (game or 3D behind)"
systems = ["NDS"]
kind = "number"
min = 0
max = 4
default = 1
args = ["--frameskip", "{value}"]

# Bilinear on the GPU instead of sharp whole pixels (each DS pixel is 4x4 panel pixels).
[[options]]
key = "linear"
label = "Smooth scaling"
kind = "toggle"
default = false
args = ["--linear"]
off = []

# Actions on a game's files, in the Game page of DSlot's menu (asked twice).
[[actions]]
label = "Clear resume state"
delete = ["{saves}/*.auto.dss"]
