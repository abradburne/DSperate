# DSperate's settings for games started from DSlot on the RG DS+, put in
# ~/.config/dsperate/dsperate.ini by the launcher's first run when there is none
# (/usr/share/dsperate/dslot/dsperate.ini; packaging/arch/dslot in DSperate).
# Everything not here is DSperate's default: `dsperate --write-config FILE` writes them all,
# commented. Changes made in the pause menu's OPTIONS are written back to this file (or to
# games/<ROM name>.ini for one game).

[video]
dual_window = true              # one DS screen on each panel; KMSDRM display 0 (DSI-1, the
                                # touch panel) is the bottom screen, and touch goes to it
fullscreen = true
sink = renderer                 # SDL's GL renderer, nearest neighbour on the GPU: each DS pixel is
                                # exactly 4x4 panel pixels (256x192 -> 1024x768), sharp. DSperate's own
                                # KMS page flips (sink = kms, the default here) hang the DS+ in suspend
                                # (CPUs going offline) while a game runs; with CPU scaling they also
                                # leave the 3D threads short (1.4% late frames in Assassin's Creed,
                                # against 0.04%), and the RGA can only scale bilinearly (blurred) and
                                # falls to 29 fps in 3D-heavy games
# hires3d = 2                   # the 3D at 512x384 on the GPU (renderer sink; also OPTIONS > 3D RESOLUTION;
                                # per game in launch.conf); 4 = 1024x768, too slow here. Drops to 1x
                                # by itself while the GPU cannot keep up. docs/rk3568-port.md
vsync_pipe = 1                  # the vsync lock (video.vsync_lock, on in DS mode) times frames to this
                                # CRTC's vblanks: 1 is the top panel. The panels refresh 8.2 ms apart,
                                # so the one followed gets each frame sooner, and most games answer a
                                # button on the top screen. docs/rk3568/measurements.md

[emu]
autosave = true                 # leaving writes the hidden auto slot ...
autoload = true                 # ... and the next start resumes from it
frameskip = 1                   # adaptive: skip drawing a frame (a display period) only while the
                                # emulation is behind real time, so the sound keeps going when a
                                # heavy scene runs a few ms over (Golden Sun at 2x, warm)

# The pad's modifier is Menu (BTN_MODE, SDL's "guide").
# Menu alone: save the auto slot and go back to DSlot.
# Back, or Menu + Start: the pause menu (save/load states, reset, OPTIONS: scaling and filters
# under VISUAL FX, the FPS counter; SAVE TO < THIS GAME | GLOBAL > keeps them for one game, in
# games/<ROM name>.ini, or for all). R2 held: fast forward. Menu + R / L: save / load the
# current slot, Menu + right / left: change slot.
[padhotkeys]
modifier = guide
quit = mod
pause = mod+start
fast_forward = +righttrigger    # R2, held (FAST FORWARD SPEED / SKIP in OPTIONS > EMULATION)

# Back (KEY_BACK) is a key on its own input device, not a pad button. SDL3 reports it as
# AC_BACK, but sdl2-compat 2.32.74 passes SDL3's keycode for it to SDL2 programs untranslated,
# where that number is SDL2's "Sleep". "AC Back" as well, for an sdl2-compat that translates it.
[hotkeys]
pause = Sleep
pause.alt = AC Back
