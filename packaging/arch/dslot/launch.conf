# Emulator options for the games DSlot starts (/usr/lib/dslot/launch), by system or by game.
# One line each: what it applies to, "=", the options. What it applies to is a system (NDS, GBA,
# GB, GBC: the Roms/ folder the game is in) or one game, by its ROM file name without the
# extension. A game's line goes after its system's, so it wins. Options given here win over
# DSperate's own settings and its in-game menu; with no line, those decide.
#
#   --hires3d N    the DS's 3D at N times its resolution, 1-4 (2 = 512x384; 4 is too slow on the DS+)
#   --frameskip N  skip drawing up to N frames while behind real time (0 = off)
#
# NDS = --hires3d 2
# Golden Sun - Dark Dawn (USA, Australia) (En,Es) = --hires3d 1
